[project]
name = "loteria"
version = "0.1.0"
description = "Sistema de verificação de gastos e frequência das loterias da Caixa."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "staticfiles", "pdfs", "core/migrations", "*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_test.py"]
testpaths = ["tests", "importacao", "apostas", "resultados"]
addopts = "-ra -q"
